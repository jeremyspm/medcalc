<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#161719"/>
<title>MedCalc — Joan’s way</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap"/>
<script>/* paint the right theme before first render — no flash */
try{document.documentElement.setAttribute('data-theme',localStorage.getItem('hub.theme')||'dark');}catch(e){}</script>
<style>
:root{
  /* HOUSE PALETTE — copied by value from hub/index.html:16-38. Do not fork. */
  --bg:#161719; --bg2:#161719; --card:#1c1c1f; --card2:#242427;
  --line:rgba(255,255,255,.10); --line2:rgba(255,255,255,.15);
  --tx:#f2f2f6; --tx2:rgba(255,255,255,.56); --tx3:rgba(255,255,255,.34);
  --acc:#6366F1; --acc2:#565AE6;      /* fill only */
  --acc-tx:#818CF8;                    /* the accent as TEXT — --acc is illegible on the ground */
  --acc-soft:rgba(99,102,241,.16);
  --good:#32D74B; --hard:#FF9F0A; --miss:#FF453A;
  --gGood:color-mix(in srgb,var(--good) 16%,transparent);
  --gHard:color-mix(in srgb,var(--hard) 16%,transparent);
  --gMiss:color-mix(in srgb,var(--miss) 16%,transparent);
  --shadow:0 14px 36px rgba(0,0,0,.16);
  --r:16px; --maxw:760px;
  /* app-only domain hues: the "test paper" the working is written on (blue ink, like her answer sheets) */
  --paper:#202126; --ink:#b9c0ff; --rule:rgba(255,255,255,.07);
  --margin:color-mix(in srgb,var(--miss) 50%,transparent);
  --hand:"Kalam","Segoe Print","Bradley Hand","Comic Sans MS",-apple-system,"Segoe UI",Roboto,sans-serif;
}
html[data-theme="light"]{
  --bg:#eceef3; --bg2:#eceef3; --card:#ffffff; --card2:#f4f5f7;
  --line:rgba(0,0,0,.10); --line2:rgba(0,0,0,.14);
  --tx:#16161a; --tx2:rgba(0,0,0,.52); --tx3:rgba(0,0,0,.34);
  --acc:#4F46E5; --acc2:#4138CF;
  --acc-tx:#4F46E5;
  --acc-soft:rgba(79,70,229,.12);
  --good:#12833A; --hard:#A35C00; --miss:#C62A20;
  --gGood:color-mix(in srgb,var(--good) 12%,transparent);
  --gHard:color-mix(in srgb,var(--hard) 12%,transparent);
  --gMiss:color-mix(in srgb,var(--miss) 12%,transparent);
  --shadow:0 14px 36px rgba(20,24,40,.10);
  --paper:#fffdf6; --ink:#1e3a8a; --rule:rgba(30,58,138,.10);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
html,body{margin:0;height:100%;overscroll-behavior-y:none}
body{
  background:linear-gradient(180deg,var(--bg),var(--bg2));
  color:var(--tx); font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased; min-height:100%;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.wrap{max-width:var(--maxw);margin:0 auto;padding:14px 16px 120px}
button{font-family:inherit;cursor:pointer;border:none;color:inherit;background:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.hidden{display:none !important}
b{font-variant-numeric:tabular-nums}

/* Header */
header{display:flex;align-items:center;gap:8px;margin:6px 0 12px}
.brand{display:flex;flex-direction:column;line-height:1.15;margin-right:auto;min-width:0}
.brand b{font-size:15px;letter-spacing:.2px}
.brand span{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:1.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:38px;height:38px;border-radius:10px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--tx2);transition:.15s}
.iconbtn:hover{border-color:var(--line2);color:var(--tx)}

/* Nav segments */
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:7px 12px;border-radius:8px;font-size:12.5px;color:var(--tx2);font-weight:600;white-space:nowrap;transition:.12s}
.seg button.on{background:var(--acc);color:#fff}
.seg button:not(.on):hover{color:var(--tx);background:var(--card2)}
.controls{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;align-items:center}

/* Category chips */
.chips{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--tx2);transition:.12s}
.chip:hover{border-color:var(--line2);color:var(--tx)}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.chip .mdot{width:8px;height:8px;border-radius:50%;background:var(--line2)}
.chip.on .mdot{background:rgba(0,0,0,.35)}
.mdot.m3{background:var(--good)} .mdot.m2{background:var(--hard)} .mdot.m1{background:var(--miss)}
.chiprow-lab{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--tx3);margin:-4px 0 7px;font-weight:700}

/* Card / stage */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:22px 22px 20px;position:relative;animation:pop .28s cubic-bezier(.2,.9,.3,1.2)}
.card.still{animation:none}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.99)}to{opacity:1;transform:none}}
.cmeta{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--card2);border:1px solid var(--line2);color:var(--tx2)}
.tag.acc{background:var(--acc-soft);color:var(--acc-tx);border-color:color-mix(in srgb,var(--acc) 38%,transparent)}
.tag.right{margin-left:auto;color:var(--tx3);border-color:var(--line)}
button.tag:hover{color:var(--tx);border-color:var(--acc)}
.q{font-size:19px;font-weight:600;line-height:1.5;letter-spacing:-.2px;margin:2px 0 4px}
.q .roundnote{display:block;margin-top:8px;font-size:13px;color:var(--tx3);font-style:italic;font-weight:500}

/* Answer input */
.ansrow{display:flex;gap:9px;margin-top:18px;align-items:stretch;flex-wrap:wrap}
.ansbox{flex:1;min-width:170px;display:flex;align-items:center;background:var(--card2);border:1.5px solid var(--line2);border-radius:12px;padding:0 14px;transition:.15s}
.ansbox:focus-within{border-color:var(--acc)}
.ansbox input{flex:1;min-width:60px;background:none;border:none;outline:none;color:var(--tx);font:600 20px/1 inherit;padding:13px 0;font-variant-numeric:tabular-nums}
.ansbox .unit{font-size:13px;font-weight:700;color:var(--tx3);white-space:nowrap;margin-left:8px}
.btn{padding:13px 22px;border-radius:12px;font-size:15px;font-weight:800;letter-spacing:.3px;transition:.12s}
.btn.primary{background:var(--acc);color:#fff}
.btn.primary:hover{background:var(--acc2);color:#eafffb}
.btn.ghost{background:var(--card2);border:1px solid var(--line2);color:var(--tx2)}
.btn.ghost:hover{color:var(--tx);border-color:var(--acc)}
.btn:disabled{opacity:.45;cursor:default}

/* Feedback */
.fb{margin-top:16px;border-radius:12px;padding:13px 15px;font-size:14.5px;line-height:1.5;animation:pop .22s ease}
.fb.ok{background:var(--gGood);border:1px solid color-mix(in srgb,var(--good) 40%,transparent)}
.fb.ok .h{color:var(--good)}
.fb.no{background:var(--gMiss);border:1px solid color-mix(in srgb,var(--miss) 40%,transparent)}
.fb.no .h{color:var(--miss)}
.fb.near{background:var(--gHard);border:1px solid color-mix(in srgb,var(--hard) 45%,transparent)}
.fb.near .h{color:var(--hard)}
.fb .h{font-weight:800;font-size:15px;margin-bottom:3px;display:flex;align-items:center;gap:7px}
.fb .slip{margin-top:8px;padding:9px 11px;border-radius:9px;background:rgba(0,0,0,.18);font-size:13.5px}
html[data-theme="light"] .fb .slip{background:rgba(255,255,255,.55)}
.fb .slip b{color:var(--hard)}

/* Worked solution */
.steps{margin-top:14px;border-top:1px dashed var(--line2);padding-top:14px}
.steps .lab{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--tx3);margin-bottom:2px}
.steps ol{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:7px;counter-reset:st}
.steps li{display:flex;gap:10px;align-items:flex-start;background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px;line-height:1.5}
.steps li::before{counter-increment:st;content:counter(st);flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:var(--bg2);border:1px solid var(--line2);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--tx2);margin-top:2px}
.steps li em{font-style:normal;color:var(--acc-tx);font-weight:700}
.sense{margin:10px 0 0;font-size:13.5px;color:var(--tx2)}
.nextrow{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
.nextrow .btn{flex:1;min-width:130px}

/* Streak / drill topbar */
.drillbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:13px;color:var(--tx2);flex-wrap:wrap}
.drillbar .pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;background:var(--card);border:1px solid var(--line);font-weight:700}
.drillbar .pill.hot{border-color:color-mix(in srgb,var(--hard) 50%,transparent);color:var(--hard)}
.drillbar .pill.toggle{cursor:pointer;border-style:dashed;transition:.12s}
.drillbar .pill.toggle:hover{color:var(--tx);border-color:var(--line2)}
.drillbar .pill.toggle.on{background:var(--acc);color:#fff;border-color:var(--acc);border-style:solid}

/* Estimate-first mode */
.estblock{margin-top:18px}
.estq{font-size:15px;font-weight:700;margin-bottom:11px}
.estq span{display:block;font-weight:500;color:var(--tx3);font-size:12.5px;margin-top:2px}
.estpills{display:flex;gap:8px;flex-wrap:wrap}
.estpill{flex:1 1 100px;min-width:100px;display:flex;flex-direction:column;align-items:flex-start;gap:2px;background:var(--card2);border:1.5px solid var(--line2);border-radius:12px;padding:11px 13px;text-align:left;transition:.12s}
.estpill:hover{border-color:var(--acc);background:var(--card)}
.estpill b{font-size:14.5px;color:var(--tx)}
.estpill span{font-size:11.5px;color:var(--tx3);font-variant-numeric:tabular-nums}
.estchosen{margin:16px 0 2px;display:inline-flex;align-items:center;gap:8px;background:var(--acc-soft);border:1px solid color-mix(in srgb,var(--acc) 38%,transparent);border-radius:20px;padding:6px 13px;font-size:13px;font-weight:700;color:var(--acc-tx)}
.estchosen b{color:var(--tx)}
.estchosen span{color:var(--tx3);font-weight:600}
.fb .estfb{margin-top:9px;padding:10px 12px;border-radius:9px;background:color-mix(in srgb,var(--acc) 11%,transparent);border:1px solid color-mix(in srgb,var(--acc) 30%,transparent);font-size:13.5px;line-height:1.5;color:var(--tx)}
.fb .estfb b{color:var(--acc-tx)}

/* Test setup + run */
.setup h3{margin:0 0 4px;font-size:18px}
.setup p{margin:0 0 14px;color:var(--tx2);font-size:13.5px}
.setrow{display:flex;align-items:center;gap:10px;margin-bottom:11px;flex-wrap:wrap}
.setrow .lab{flex:0 0 92px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:var(--tx3)}
.bigstart{width:100%;margin-top:14px;padding:15px;border-radius:12px;color:#fff;font-size:16px;font-weight:900;letter-spacing:.3px;background:var(--acc);box-shadow:0 1px 3px rgba(0,0,0,.22);line-height:1.3}
.bigstart:hover{filter:brightness(1.08)}
.testbar{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:13.5px;color:var(--tx2);flex-wrap:wrap}
.testbar b{color:var(--tx)}
.testbar .timer{margin-left:auto;font-weight:800;font-variant-numeric:tabular-nums}
.testbar .timer.low{color:var(--miss)}

/* Results */
.result-hero{border-radius:var(--r);padding:26px 20px;text-align:center;margin-bottom:14px;border:1px solid var(--line);animation:pop .3s ease}
.result-hero.pass{background:linear-gradient(160deg,color-mix(in srgb,var(--good) 16%,transparent),color-mix(in srgb,var(--good) 4%,transparent));border-color:color-mix(in srgb,var(--good) 45%,transparent)}
.result-hero.fail{background:linear-gradient(160deg,color-mix(in srgb,var(--miss) 16%,transparent),color-mix(in srgb,var(--miss) 4%,transparent));border-color:color-mix(in srgb,var(--miss) 45%,transparent)}
.result-hero.still{animation:none}
.result-hero .big{font-size:40px;font-weight:900;letter-spacing:-1px}
.result-hero.pass .big{color:var(--good)} .result-hero.fail .big{color:var(--miss)}
.result-hero .sub{font-size:14px;color:var(--tx2);margin-top:4px}
.rev{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:9px;overflow:hidden}
.rev .rhead{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;cursor:pointer;font-size:14px;line-height:1.45}
.rev .rhead .ic{flex:0 0 auto;font-size:15px;margin-top:1px}
.rev .rhead .qq{flex:1;min-width:0;color:var(--tx2)}
.rev .rhead .qq .qx{font-weight:inherit;padding:0}
.rev .rhead .ans{flex:0 0 auto;font-weight:700;font-size:13px;text-align:right;color:var(--tx3);max-width:40%}
.rev .rhead .ans b{display:block;font-size:14px}
.rev .rhead .ans b.ok{color:var(--good)} .rev .rhead .ans b.no{color:var(--miss)}
.rev .rbody{padding:0 14px 13px}

/* Stats */
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 14px;min-width:0}
.stat .n{font-size:24px;font-weight:800;letter-spacing:-.5px}
.stat .l{font-size:11px;color:var(--tx3);text-transform:uppercase;letter-spacing:.8px;margin-top:2px}
.catstat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px}
.catstat .top{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700;margin-bottom:7px}
.catstat .top .m{margin-left:auto;font-size:11.5px;font-weight:800;text-transform:uppercase;letter-spacing:.6px}
.catstat .top .m.m3{color:var(--good)} .catstat .top .m.m2{color:var(--hard)} .catstat .top .m.m1{color:var(--miss)} .catstat .top .m.m0{color:var(--tx3)}
.catstat .bar{height:7px;border-radius:5px;background:var(--card2);overflow:hidden}
.catstat .bar i{display:block;height:100%;background:var(--acc)}
.catstat .sub{font-size:12px;color:var(--tx3);margin-top:5px}
.sliplist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.sliplist li{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 13px;font-size:13.5px}
.sliplist li b{margin-left:auto;color:var(--hard)}
h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:1px;color:var(--tx3);margin:20px 0 9px}
.danger{color:var(--miss);border-color:color-mix(in srgb,var(--miss) 40%,transparent) !important}
.histrow{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-size:13px;margin-bottom:7px;color:var(--tx2);flex-wrap:wrap}
.histrow .sc{font-weight:800;font-size:14px;color:var(--tx)}
.histrow .pf{margin-left:auto;font-weight:800;font-size:11.5px;letter-spacing:.5px}
.histrow .pf.p{color:var(--good)} .histrow .pf.f{color:var(--miss)}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(5,9,16,.66);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .18s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--card);border:1px solid var(--line2);border-radius:18px 18px 0 0;max-width:var(--maxw);width:100%;max-height:86vh;overflow:auto;padding:20px 20px 30px;box-shadow:var(--shadow)}
@media(min-width:700px){.modal{align-items:center;padding:20px}.sheet{border-radius:18px}}
.sheet h3{margin:0 0 3px;font-size:17px;display:flex;align-items:center;gap:8px}
.sheet .close{position:sticky;float:right;top:0;font-size:20px;color:var(--tx3);padding:2px 8px}
.fcard{background:var(--card2);border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-top:10px}
.fcard .fn{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--acc-tx);margin-bottom:4px}
.fcard .fx{font-size:14.5px;line-height:1.55}
.fcard .fx code{font:600 13.5px/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--tx)}
.fcard .fx small{display:block;color:var(--tx2);margin-top:4px;font-size:12.5px}
.fcard .paper{margin-top:6px}
.foot{margin-top:26px;text-align:center;font-size:11.5px;color:var(--tx3)}

/* ---------- Joan's paper: the working, laid out the way her answer sheets write it ---------- */
.paper{background:var(--paper);border:1px solid var(--line);border-left:3px solid var(--margin);border-radius:12px;padding:6px 14px;margin-top:14px;color:var(--ink);overflow-x:auto}
.pline{display:flex;align-items:center;gap:4px 12px;min-height:46px;padding:6px 0}
.pline+.pline{border-top:1px dashed var(--rule)}
.plab{flex:0 0 62px;font:800 9.5px/1.2 -apple-system,"Segoe UI",Roboto,sans-serif;text-transform:uppercase;letter-spacing:.7px;color:var(--tx3)}
.plab:empty{display:none}
.pexpr{flex:1;min-width:0;display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;font:400 20px/1.25 var(--hand)}
.frac{display:inline-flex;flex-direction:column;align-items:center}
.frac>.ft,.frac>.fbt{display:flex;align-items:center;gap:6px;padding:1px 6px}
.frac>.ft{border-bottom:2px solid currentColor;padding-bottom:4px}
.frac>.fbt{padding-top:4px}
.po{font-weight:700;opacity:.85}
.pq{white-space:nowrap}
.pq.pa{text-decoration:underline double;text-underline-offset:5px;font-weight:700}
.pq.ph{font:800 10.5px/1 -apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx3);border:1.5px dashed var(--line2);border-radius:7px;padding:7px 8px;text-transform:uppercase;letter-spacing:.5px}
.pq.fresh{animation:ink .6s ease}
@keyframes ink{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.slot{font:600 16px/1.2 -apple-system,"Segoe UI",Roboto,sans-serif;background:var(--card);color:var(--tx);border:1.5px solid var(--line2);border-radius:8px;padding:7px 8px;min-width:0;max-width:100%}
.slot::placeholder{color:var(--tx3);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.slot:focus{outline:none;border-color:var(--acc)}
.slot.ok{border-color:var(--good);background:var(--gGood)}
.slot.warn{border-color:var(--hard);background:var(--gHard)}
.slot.bad{border-color:var(--miss);background:var(--gMiss)}
.mark{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.mark li{font-size:13.5px;line-height:1.45;padding:8px 11px;border-radius:9px;background:var(--card2);border:1px solid var(--line)}
.mark li.bad{border-color:color-mix(in srgb,var(--miss) 45%,transparent)}
.mark li.warn{border-color:color-mix(in srgb,var(--hard) 45%,transparent)}
.verdict{margin-top:14px;font-weight:800;font-size:15px}
.verdict.ok{color:var(--good)} .verdict.no{color:var(--miss)}
.ladder{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:6px 10px;margin:10px 0 12px;font:700 20px/1.2 var(--hand);color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.ladder small{font:800 11px/1 -apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx3)}

/* numbers in a question you can pick */
.qx{font-weight:700;border-radius:5px;padding:0 2px;transition:background .25s,color .25s}
.qx.hl{background:color-mix(in srgb,var(--tx) 12%,transparent)}
.qx.hl[data-r="w"]{background:var(--acc-soft);color:var(--acc-tx)}
.qx.hl[data-r="g"]{background:var(--gGood);color:var(--good)}
.qx.hl[data-r="v"]{background:var(--gHard);color:var(--hard)}
.mock .qx{font-weight:inherit;padding:0}

/* guided build ("with me") */

  .pline{flex-wrap:wrap}

<!-- Optional cloud sync: dormant unless signed in at jeremyspm.github.io. Fully offline-first without it. -->
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script src="https://jeremyspm.github.io/cloud/cloud.js"></script>
<script>
'use strict';
/* ============================== utils ============================== */
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const chance=p=>Math.random()<p;
const near=(a,b,t)=>Math.abs(a-b)<=(t!=null?t:Math.max(Math.abs(b)*0.005,0.0005));
const same=(a,b)=>Math.abs(a-b)<=Math.max(Math.abs(b)*1e-6,1e-9);
/* 4 dp so pool values like 0.0625 display exactly — 3 dp corrupted them */
function fmt(n){ if(!isFinite(n))return'—'; const r=Math.round(n*10000)/10000; return String(parseFloat(r.toFixed(4))); }
const fmtOK=v=>isFinite(v)&&same(parseFloat(fmt(v)),v);
const r6=x=>Math.round(x*1e6)/1e6;
const clean=(x,dp)=>{ const m=Math.pow(10,dp); return Math.abs(x*m-Math.round(x*m))<1e-6; };
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
/* "1,000" is a thousands comma; "2,5" is a decimal comma */
function parseNum(raw){ const s=String(raw).trim(); if(/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) return s.replace(/,/g,''); return s.replace(',','.'); }
const ADULTS=['Mr Jones','Mrs M','Mr S','Mere','Moana','Hemi','Aroha','Mr Lee','Mrs Dell','Mr Singh','Sione','Losa','Te Atawhai','Adam','Linda','Mele','Wiremu','Grace','Mr Chen','Priya','Tane','Mrs Patel'];
const KIDS=['Baby P','Baby J','Baby K','Pia','Kalangi','Kaia','Wei','Naveen','Sophie','Nikau','Ruby','Leo','Isla','Tama','Ana'];
const NAMES=ADULTS;
/* magnitude tiers for Estimate-first mode — decade buckets, so a 10× decimal
   slip always lands in a different bucket than the true answer */
const MAGTIERS=[
  [0,0.1,'tiny','under 0.1'],
  [0.1,1,'a fraction','0.1–1'],
  [1,10,'single digits','1–10'],
  [10,100,'tens','10–100'],
  [100,1000,'hundreds','100–1000'],
  [1000,10000,'thousands','1000–10000'],
  [10000,Infinity,'huge','10000+'],
];
function tierIndex(v){ v=Math.abs(v); for(let i=0;i<MAGTIERS.length;i++){ if(v<MAGTIERS[i][1]) return i; } return MAGTIERS.length-1; }
/* 3 ascending decade options bracketing the true answer; correct position varies
   so the decoys are exactly the ×10 / ÷10 decimal-slip magnitudes */
function buildEstOpts(ans){
  const ct=tierIndex(ans);
  const p=Math.floor(Math.random()*3);
  const start=Math.max(0,Math.min(ct-p,MAGTIERS.length-3));
  const opts=[];
  for(let i=start;i<start+3;i++){ const t=MAGTIERS[i]; opts.push({name:t[2],range:t[3],gi:i}); }
  return {opts};
}

/* ============================== state ============================== */
const KEY='medcalcdrill.v1';
/* L = the lesson that teaches it; extra = not in Joan's 2026 slides (Student Guide only) */
const CATS={
  tab:{name:'Tablets & capsules',icon:'💊',L:'L1'},
  conv:{name:'Conversions',icon:'🔁',L:'L2'},
  liq:{name:'Oral liquids',icon:'🥄',L:'L3'},
  inj:{name:'Injections',icon:'💉',L:'L3'},
  wt:{name:'Body weight',icon:'⚖️',L:'L4'},
  ratio:{name:'Adrenaline 1:1000',icon:'🚑',L:'L5'},
  drip:{name:'Drip rates',icon:'💧',L:'L6'},
  powder:{name:'Powders',icon:'🧪',L:'L7'},
  dil:{name:'Syringe dilutions',icon:'🧫',L:'L8'},
  rate:{name:'Pump rate mL/hr',icon:'⏱️',extra:true},
  time:{name:'Infusion time',icon:'⌛',extra:true},
};
const SLIPS={
  units:'Decimal / conversion slip (×10, ×1000)',
  inverted:'Formula upside down (got ÷ want)',
  volume:'Left off × Volume',
  time:'Hours not turned into minutes (× 60)',
  factor:'Wrong / missing drop factor',
  perdose:'Per-day vs single dose (how often)',
  weight:'Forgot to × body weight',
  rounding:'Right maths, wrong rounding',
  stopped:'Stopped one step early (mg, not mL)',
  order:'Calculator order (top & bottom first, add first)',
  dilution:'Dilution — didn’t add the volumes first',
  redherring:'Used a red herring (bottle size, %, how often)',
};
let S=load();
if(window.Cloud) Cloud.sync([KEY]);   // syncs progress across devices when signed in; no-op otherwise
function load(){
  const stats={}; Object.keys(CATS).forEach(c=>stats[c]={a:0,c:0,last:[]});
  const def={theme:'dark',stats,slips:{},streak:0,best:0,tests:[],cat:'all',est:false,fill:false,mt:30,learn:{}};
  try{ const s=JSON.parse(localStorage.getItem(KEY));
    if(s&&s.stats){
      // migration guard: categories added in later versions get fresh stats
      Object.keys(CATS).forEach(c=>{ if(!s.stats[c]) s.stats[c]={a:0,c:0,last:[]}; });
      if(!Object.keys(CATS).includes(s.cat)&&s.cat!=='all') s.cat='all';
      if(!s.learn||typeof s.learn!=='object') s.learn={};
      return Object.assign(def,s);
    }
  }catch(e){}
  return def;
}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(S)); }catch(e){} }

/* ============================== Joan engine ==============================
   Everything here follows Joan Mackie's 2026 deck "Medication Calculations
   (Parts One & Two)" and her handwritten Canvas answer sheets:
     1. What you want / What you've got × Volume = Dosage amount
     2. Dose per kg (mg/kg) × Body weight (kg) = Administered dose
     3. Volume (mL) × drop factor / Time (hr) × 60 = Rate (drops/min)
   A question carries its WORKING as token lines, so ONE record drives the
   paper view, the guided build (steps), the fill-the-working template, the
   slip diagnosis (traps) and the multiple-choice distractors.
   Conventions copied from her sheets: a conversion goes on its own line
   first, the BIGGER unit is multiplied down × 1000, "× 1 tablet" for tablets,
   drip rates are written to 2 dp (truncated, as she writes 83.33 / 27.77)
   then rounded .5-up, medication volumes are never rounded, "mcg" as her
   test papers print it. */

const WORDU={tablet:1,capsule:1,doses:1,units:1,drops:1,'drops/min':1};
function uName(u,v){ if(u==='tablet'||u==='capsule') return v===1?u:u+'s'; if(u==='doses') return v===1?'dose':'doses'; return u; }
function qs(v,u){ return fmt(v)+(WORDU[u]?' ':'')+uName(u,v); }
const qq=o=>qs(o.v,o.u);
const tr2=x=>fmt(Math.floor(x*100+1e-7)/100);
const RANK={mcg:0,mg:1,g:2,mL:0,L:1};
const BIGGER=(a,b)=>RANK[a]>RANK[b];
const inBase=(v,u)=>u==='g'?v*1e6:u==='mg'?v*1e3:u==='L'?v*1000:v;   // g/mg/mcg → mcg · L → mL
function roundHalfUp(top,bot){ const q=Math.floor(top/bot), rem=r6(top-q*bot); return 2*rem>=bot?q+1:q; }

/* units a student might type, normalised to the ones the working uses */
const UALIAS={mg:'mg',mgs:'mg',milligram:'mg',milligrams:'mg',
  mcg:'mcg',mcgs:'mcg',ug:'mcg','µg':'mcg','μg':'mcg',microgram:'mcg',micrograms:'mcg',
  g:'g',gm:'g',gram:'g',grams:'g',
  kg:'kg',kgs:'kg',kilo:'kg',kilos:'kg',kilogram:'kg',kilograms:'kg',
  ml:'mL',mls:'mL',millilitre:'mL',millilitres:'mL',milliliter:'mL',milliliters:'mL',
  l:'L',litre:'L',litres:'L',liter:'L',liters:'L',
  tab:'tablet',tabs:'tablet',tablet:'tablet',tablets:'tablet','tablet(s)':'tablet',
  cap:'capsule',caps:'capsule',capsule:'capsule',capsules:'capsule','capsule(s)':'capsule',
  'mg/kg':'mg/kg','mg/kg/day':'mg/kg/day','mg/kg/d':'mg/kg/day','mg/day':'mg/day','mg/d':'mg/day',
  'drops/ml':'drops/mL','drop/ml':'drops/mL','gtt/ml':'drops/mL','gtts/ml':'drops/mL',
  hr:'hr',hrs:'hr',h:'hr',hour:'hr',hours:'hr',
  min:'mins',mins:'mins',minute:'mins',minutes:'mins',
  drops:'drops',drop:'drops',gtt:'drops',gtts:'drops',
  'drops/min':'drops/min','drop/min':'drops/min','gtt/min':'drops/min','gtts/min':'drops/min',dpm:'drops/min','drops/minute':'drops/min',
  units:'units',unit:'units',u:'units',iu:'units',
  doses:'doses',dose:'doses'};
function normUnit(s){
  s=String(s).trim().toLowerCase().replace(/\.$/,'').replace(/\s*\/\s*/g,'/').replace(/\s+per\s+/g,'/').replace(/\s+/g,' ');
  if(UALIAS[s]) return UALIAS[s];
  s=s.replace(/\s/g,''); return UALIAS[s]||'?';
}
function parseQty(raw){
  let s=String(raw==null?'':raw).trim();
  if(!s) return {empty:true};
  s=s.replace(/(\d),(\d{3})(?!\d)/g,'$1$2').replace(/^(\d+),(\d+)/,'$1.$2');
  const m=s.match(/^(\d+(?:\.\d*)?|\.\d+)\s*(.*)$/);
  if(!m) return {bad:true};
  const us=m[2].trim();
  return {v:parseFloat(m[1]), u:us?normUnit(us):'', leadDot:m[1][0]==='.'};
}

/* token builders for a line of working */
const TK={
  q:(k,v,u,x)=>Object.assign({t:'q',k,v,u},x||{}),   // a quantity — one box in "fill the working"
  f:(top,bot)=>({t:'f',top,bot}),                     // a fraction
  o:s=>({t:'o',s}),                                   // ×  ÷  +  =  →
  x:s=>({t:'x',s}),                                   // fixed text (1000, 60, words)
};
const LAB={w0:'charted',w:'want',g0:'stock',g:'got',v:'volume',a:'answer',pk:'per kg',kg:'weight',d:'dose',d2:'dose',dd:'day total',n:'doses',
  av:'ampoule',dv:'water',tot:'total',top:'drops',bot:'mins',raw:'top ÷ bottom',df:'drop factor',h:'hours',v0:'ordered',c0:'amount'};
const BOXHINT={w:'WANT = what’s charted (converted if the units differ).',w0:'Copy what’s charted, exactly as written.',g:'GOT = what’s in stock (converted if the units differ).',g0:'Copy the stock strength, exactly as written.',
  v:'VOLUME = what one lot of the GOT comes in.',a:'Re-do the sum on the calculator.',pk:'The dose per kg from the order.',kg:'The patient’s weight.',d:'mg/kg × kg.',d2:'The dose you just worked out — now it’s the WANT.',dd:'kg × mg/kg/day.',
  n:'How many doses the day is split into.',av:'The ampoule’s volume.',dv:'The water you add.',tot:'Ampoule mL + water mL.',top:'Volume × drop factor.',bot:'Hours × 60.',
  raw:'Top ÷ bottom.',df:'Drops per mL from the giving set.',h:'The hours it runs over.',v0:'The volume exactly as the order writes it.',c0:'The amount to convert.'};
/* what a picked number IS, for "that's not it" feedback */
const ROLE={w:'what’s charted — what you WANT',g:'what’s in stock — what you’ve GOT',v:'the volume the stock comes in',
  freq:'HOW OFTEN it’s given — a red herring for a single dose',kg:'the patient’s weight',pk:'the dose per kg',
  df:'the drop factor (drops per mL)',t:'the time it runs over',iv:'the volume of fluid to run in',
  fluid:'what’s in the bag — a red herring for drip rates',total:'the bottle’s total volume after mixing — a red herring',
  water:'the water you add — a red herring once it’s mixed',av:'the ampoule’s volume',dv:'the water you add in the syringe',
  ratio:'the ratio — it tells you the strength, not the dose',n:'how many doses the day is split into',c0:'the amount to convert'};

function PB(){ const chips=[]; return {chips, sp:(r,t)=>{ chips.push({r,t}); return `<span class="qx" data-r="${r}">${esc(t)}</span>`; }}; }
function finish(q){
  q.traps=(q.traps||[]).filter(t=>isFinite(t.v)&&t.v>0&&!near(t.v,q.answer));
  q.chips=shuffle((q.chips||[]).slice());
  return q;
}

/* ---- formula 1: what you want / what you've got × volume ---- */
function buildWG(o){
  const w=o.want, g=o.got, vol=o.vol;
  let conv=null, wW=w.v, gW=g.v, U=w.u;
  if(w.u!==g.u){
    if(BIGGER(w.u,g.u)){ conv='want'; wW=r6(w.v*1000); U=g.u; }
    else { conv='got'; gW=r6(g.v*1000); U=w.u; }
  }
  const aU=vol.u, ans=r6(wW/gW*vol.v), tabby=aU==='tablet'||aU==='capsule';
  const lines=[];
  if(conv==='want') lines.push({lab:'convert',when:'conv',toks:[TK.q('w0',w.v,w.u),TK.o('×'),TK.x('1000'),TK.o('='),TK.q('w',wW,U)]});
  if(conv==='got')  lines.push({lab:'convert',when:'conv',toks:[TK.q('g0',g.v,g.u),TK.o('×'),TK.x('1000'),TK.o('='),TK.q('g',gW,U)]});
  lines.push({lab:'formula',toks:[TK.f([TK.q('w',wW,U)],[TK.q('g',gW,U)]),TK.o('×'),TK.q('v',vol.v,vol.u,{uopt:tabby?'warn':null}),TK.o('='),TK.q('a',ans,aU)]});

  const S=[];
  if(o.pre) S.push(...o.pre);
  S.push({k:'pick',r:'w',chk:'formula',ask:'What do you WANT?',sub:'what’s charted / prescribed / ordered',reveal:conv==='want'?['w0']:['w0','w'],
    ok:`${qq(w)} is what’s charted — your WANT. It goes on top.`});
  S.push({k:'pick',r:'g',ask:'What have you GOT?',sub:'what’s in stock / on hand / “you have”',reveal:conv==='got'?['g0']:['g0','g'],
    ok:`${qq(g)} is what’s on the shelf — your GOT. It goes on the bottom.`});
  if(!conv){
    S.push({k:'choice',chk:'units',ask:`Units the same? The top is ${w.u}, the bottom is ${g.u}.`,opts:[
      {t:'Yes — same unit',ok:true,msg:`Both in ${w.u}, so no converting.`},
      {t:'No — convert first',ok:false,msg:`Look again — both are ${w.u}. You only convert when they’re different.`}]});
  } else {
    const from=conv==='want'?w:g, other=conv==='want'?g:w, toV=conv==='want'?wW:gW;
    S.push({k:'choice',chk:'units',ask:`Units the same? The top is ${w.u}, the bottom is ${g.u}.`,opts:[
      {t:'Yes',ok:false,msg:`${w.u} and ${g.u} are different units. Joan: the unit MUST be the same on the top and the bottom — convert first.`},
      {t:'No — convert first',ok:true,reveal:['conv'],msg:'Different units, so convert BEFORE the formula. Joan writes the conversion on its own line.'}]});
    S.push({k:'choice',ask:'Which one do you convert?',sub:'Joan: multiply the BIGGER unit down — × 1000',opts:shuffle([
      {t:`${qq(from)} → × 1000 into ${U}`,ok:true,msg:`${from.u} is the bigger unit. × 1000 turns it into ${U} — no fiddly 0.xx numbers.`},
      {t:`${qq(other)} → ÷ 1000 into ${from.u}`,ok:'alt',msg:'That works too (her answer sheets accept it as an “OR”), but it makes 0.xx numbers, which are easy to misread. Her slides say multiply the bigger unit down, so we’ll do that.'}])});
    S.push({k:'num',ask:'Convert it.',pre:`${qq(from)} × 1000 =`,unit:U,v:toV,reveal:[conv==='want'?'w':'g'],
      traps:[[r6(from.v/1000),'You divided. Going DOWN to a smaller unit, the number gets BIGGER — × 1000.'],[r6(from.v*100),'That’s × 100. Each step on the ladder (g → mg → mcg) is × 1000 — three places.'],[r6(from.v*10),'That’s × 10. Each step on the ladder is × 1000 — three places.']],
      ok:`${qs(toV,U)}. Now the top and the bottom are both ${U}.`});
  }
  if(tabby){
    S.push({k:'choice',ask:'What’s the VOLUME?',sub:`one ${aU} holds ${qq(g)}`,reveal:['v'],opts:shuffle([
      {t:`1 ${aU}`,ok:true,msg:`One ${aU} holds the ${qq(g)}, so Volume = 1 ${aU}. Joan writes “× 1 ${aU}” so the answer comes out in ${aU}s.`},
      {t:`${fmt(g.v)} ${aU}s`,ok:false,msg:`${fmt(g.v)} is the strength (${g.u}) of ONE ${aU} — not a number of ${aU}s.`},
      {t:'Leave it out',ok:false,msg:`Joan’s formula always has × Volume. For ${aU}s it’s “× 1 ${aU}” — it puts the unit on your answer.`}])});
  } else {
    S.push({k:'pick',r:'v',ask:'What’s the VOLUME?',sub:`the mL that the ${qq(g)} comes in`,reveal:['v'],ok:`The ${qq(g)} comes in ${qq(vol)} — that’s your Volume.`});
  }
  const ct=[[r6(gW/wW*vol.v),'Upside down — that’s got ÷ want. WANT goes on top.']];
  if(vol.v!==1) ct.push([r6(wW/gW),`You left off × ${qq(vol)}.`]);
  S.push({k:'num',chk:'formula',ask:'Now the calculator.',sub:'top ÷ bottom × volume',pre:`${fmt(wW)} ÷ ${fmt(gW)} × ${fmt(vol.v)} =`,unit:uName(aU,ans),v:ans,reveal:['a'],traps:ct,ok:`= ${qs(ans,aU)}.`});

  const traps=[{v:r6(gW/wW*vol.v),slip:'inverted',msg:'Formula upside down — WANT goes on top, GOT on the bottom.'}];
  if(vol.v!==1) traps.push({v:r6(wW/gW),slip:'volume',msg:`You left off × Volume (× ${qq(vol)}) — the mL the stock comes in.`});
  if(conv) traps.push({v:r6(w.v/g.v*vol.v),slip:'units',msg:`You didn’t convert first — ${w.u} on the top, ${g.u} on the bottom. Units must match.`});
  if(o.total) traps.push({v:r6(wW/gW*o.total.v),slip:'redherring',msg:`You used the bottle’s total (${qq(o.total)}). Use the strength after mixing: ${qq(g)}/${qq(vol)}.`});
  if(o.traps) traps.push(...o.traps);

  let sense;
  if(tabby) sense= ans<=4?`${qs(ans,aU)} — a normal amount (usually 1–4). More than 4? Stop and re-check.`:`${qs(ans,aU)} is a lot — re-check before you give it.`;
  else if(o.kind==='oral') sense=`${qs(ans,'mL')} — a sensible oral amount to measure.`;
  else sense=`${qs(ans,'mL')} — a sensible amount to draw up.`;
  return finish({cat:o.cat,prompt:o.prompt||'',chips:o.chips||[],lines,steps:S,answer:ans,exact:ans,unit:uName(aU,2),aU,traps,sense});
}

/* ---- formula 2: dose per kg × body weight (then formula 1 if it wants a volume) ---- */
function buildWT(o){
  const lines=[], S=[], traps=[], mode=o.mode;
  let dose, daily=null;
  if(mode==='day'){
    daily=r6(o.kg*o.pk); dose=r6(daily/o.n);
    lines.push({lab:'day total',toks:[TK.q('kg',o.kg,'kg'),TK.o('×'),TK.q('pk',o.pk,'mg/kg/day'),TK.o('='),TK.q('dd',daily,'mg/day',{ualt:['mg']})]});
    lines.push({lab:'one dose',toks:[TK.q('dd',daily,'mg/day',{ualt:['mg']}),TK.o('÷'),TK.q('n',o.n,'doses',{uopt:'ok'}),TK.o('='),TK.q('d',dose,'mg')]});
  } else {
    dose=r6(o.pk*o.kg);
    lines.push({lab:'weight',toks:[TK.q('pk',o.pk,'mg/kg'),TK.o('×'),TK.q('kg',o.kg,'kg'),TK.o('='),TK.q(mode==='mg'?'a':'d',dose,'mg')]});
  }
  let ans=dose, aU='mg', tabby=false;
  if(mode!=='mg'){
    const g=o.got, vol=o.vol; tabby=vol.u==='tablet';
    ans=r6(dose/g.v*vol.v); aU=vol.u;
    lines.push({lab:'formula',toks:[TK.f([TK.q('d2',dose,'mg')],[TK.q('g',g.v,'mg')]),TK.o('×'),TK.q('v',vol.v,vol.u,{uopt:tabby?'warn':null}),TK.o('='),TK.q('a',ans,aU)]});
  }
  if(mode==='day'){
    S.push({k:'pick',r:'pk',ask:'What’s the dose per kg per DAY?',sub:'“mg/kg/day” — read the / as “per”',reveal:['pk'],ok:`${qs(o.pk,'mg/kg/day')} — that many mg for every kg, across the whole day.`});
    S.push({k:'pick',r:'kg',ask:'What does the patient WEIGH?',sub:'the kg',reveal:['kg'],ok:`${qs(o.kg,'kg')}.`});
    S.push({k:'num',chk:'formula',ask:'Line 1 — the DAY’s total.',sub:'weight × mg/kg/day',pre:`${qs(o.kg,'kg')} × ${qs(o.pk,'mg/kg/day')} =`,unit:'mg/day',v:daily,reveal:['dd'],
      traps:[[o.pk,'That’s the dose for ONE kg — × the weight.']],ok:`${qs(daily,'mg/day')} for the whole day.`});
    S.push({k:'pick',r:'n',ask:'How many doses is the day split into?',sub:'“divided doses”',reveal:['n'],ok:`${o.n} doses — so one dose is the day’s total ÷ ${o.n}.`});
    S.push({k:'num',ask:'Line 2 — ONE dose.',sub:'day total ÷ number of doses',pre:`${qs(daily,'mg/day')} ÷ ${o.n} doses =`,unit:'mg',v:dose,reveal:['d'],
      traps:[[r6(daily*o.n),'Divide — the day’s total is SPLIT into doses, so one dose is smaller.']],ok:`${qs(dose,'mg')} per dose.`});
    traps.push({v:r6(daily/o.got.v*o.vol.v),slip:'perdose',msg:'You used the whole DAY’s total — divide by the number of doses first.'});
    traps.push({v:dose,slip:'stopped',msg:`That’s one dose in mg — the question wants ${uName(o.vol.u,2)}. One more line: formula 1.`});
    traps.push({v:r6(daily*o.n/o.got.v*o.vol.v),slip:'perdose',msg:'You multiplied by the number of doses — the day’s total is DIVIDED into doses.'});
  } else {
    S.push({k:'pick',r:'pk',ask:'What’s the dose PER KG?',sub:'“mg/kg” — read the / as “per”: mg for every kg',reveal:['pk'],ok:`${qs(o.pk,'mg/kg')} — ${fmt(o.pk)}mg for every kg the patient weighs.`});
    S.push({k:'pick',r:'kg',ask:'What does the patient WEIGH?',sub:'the kg',reveal:['kg'],ok:`${qs(o.kg,'kg')}.`});
    if(o.freq) S.push({k:'choice',ask:`The order says “${o.freq.t}”. Does that go in a SINGLE-dose sum?`,opts:shuffle([
      {t:'No — that’s how often',ok:true,msg:`Right — “${o.freq.t}” is how OFTEN, not how MUCH. A single dose ignores it. Joan calls these red herrings.`},
      {t:`Yes — × ${o.freq.n}`,ok:false,msg:`× ${o.freq.n} would give the whole DAY. The question asks for ONE dose — ignore how often.`}])});
    const wt=[[o.pk,'That’s the dose for ONE kg — × the weight.']];
    if(o.freq&&o.freq.n>1) wt.push([r6(dose*o.freq.n),'You multiplied by how often — a single dose ignores frequency.']);
    S.push({k:'num',chk:'formula',ask:'Formula 2: dose per kg × weight.',sub:'mg/kg × kg = mg',pre:`${qs(o.pk,'mg/kg')} × ${qs(o.kg,'kg')} =`,unit:'mg',v:dose,reveal:[mode==='mg'?'a':'d'],
      traps:wt,ok:mode==='mg'?`${qs(dose,'mg')} — that’s the single dose.`:`${qs(dose,'mg')} for one dose — but the question wants mL, so keep going.`});
    if(mode==='mg'){
      traps.push({v:o.pk,slip:'weight',msg:'That’s the dose for ONE kg — multiply by the patient’s weight.'});
      if(o.freq&&o.freq.n>1) traps.push({v:r6(dose*o.freq.n),slip:'perdose',msg:`You multiplied by how often (${o.freq.t}) — a single dose ignores frequency.`});
      traps.push({v:r6(o.pk/o.kg),slip:'inverted',msg:'You divided — it’s mg/kg × kg.'});
    } else {
      traps.push({v:dose,slip:'stopped',msg:'That’s the dose in mg — the question wants mL. One more line: formula 1.'});
      traps.push({v:r6(o.pk/o.got.v*o.vol.v),slip:'weight',msg:'You skipped the weight — work out mg/kg × kg first.'});
      if(o.freq&&o.freq.n>1) traps.push({v:r6(dose*o.freq.n/o.got.v*o.vol.v),slip:'perdose',msg:`You multiplied by how often (${o.freq.t}) — a single dose ignores frequency.`});
    }
  }
  if(mode!=='mg'){
    const g=o.got, vol=o.vol;
    S.push({k:'choice',ask:'The question wants a volume. What’s your WANT now?',reveal:['d2'],opts:shuffle([
      {t:`${qs(dose,'mg')} — the dose I just made`,ok:true,msg:'Yes — the mg you just worked out becomes the WANT in formula 1.'},
      {t:mode==='day'?qs(o.pk,'mg/kg/day'):qs(o.pk,'mg/kg'),ok:false,msg:'That’s per kg. The patient’s real dose is the one you just worked out.'}])});
    S.push({k:'pick',r:'g',ask:'What have you GOT?',sub:'what’s in stock',reveal:['g'],ok:`${qq(g)} — your GOT, on the bottom.`});
    if(tabby) S.push({k:'choice',ask:'What’s the VOLUME?',sub:`one tablet holds ${qq(g)}`,reveal:['v'],opts:shuffle([
      {t:'1 tablet',ok:true,msg:'One tablet holds the stock strength — “× 1 tablet”.'},
      {t:`${fmt(g.v)} tablets`,ok:false,msg:`${fmt(g.v)} is the mg in ONE tablet, not a count of tablets.`}])});
    else S.push({k:'pick',r:'v',ask:'What’s the VOLUME?',sub:`the mL that the ${qq(g)} comes in`,reveal:['v'],ok:`The ${qq(g)} comes in ${qq(vol)}.`});
    const ct=[[r6(g.v/dose*vol.v),'Upside down — WANT goes on top.']];
    if(vol.v!==1) ct.push([r6(dose/g.v),`You left off × ${qq(vol)}.`]);
    S.push({k:'num',chk:'formula',ask:'Now the calculator.',sub:'top ÷ bottom × volume',pre:`${fmt(dose)} ÷ ${fmt(g.v)} × ${fmt(vol.v)} =`,unit:uName(aU,ans),v:ans,reveal:['a'],traps:ct,ok:`= ${qs(ans,aU)}.`});
    traps.push({v:r6(g.v/dose*vol.v),slip:'inverted',msg:'Formula upside down — WANT goes on top.'});
    if(vol.v!==1) traps.push({v:r6(dose/g.v),slip:'volume',msg:`You left off × Volume (× ${qq(vol)}).`});
  }
  const sense = mode==='mg' ? `${qs(dose,'mg')} = ${fmt(o.pk)}mg for each of ${fmt(o.kg)}kg. Sensible.`
    : tabby ? `${qs(ans,aU)} — a normal amount (usually 1–4).` : `${qs(ans,'mL')} — a sensible oral amount to measure.`;
  return finish({cat:o.cat||'wt',prompt:o.prompt||'',chips:o.chips||[],lines,steps:S,answer:ans,exact:ans,unit:uName(aU,2),aU,traps,sense});
}

/* ---- formula 3: drip rate ---- */
function buildDrip(o){
  const vol=o.vol, mL=vol.u==='L'?r6(vol.v*1000):vol.v, df=o.df, hr=o.hr;
  const top=r6(mL*df), bot=hr*60, exact=top/bot, rate=roundHalfUp(top,bot), whole=Math.abs(exact-Math.round(exact))<1e-9;
  const lines=[];
  if(vol.u==='L') lines.push({lab:'convert',when:'conv',toks:[TK.q('v0',vol.v,'L'),TK.o('×'),TK.x('1000'),TK.o('='),TK.q('v',mL,'mL')]});
  lines.push({lab:'formula',toks:[TK.f([TK.q('v',mL,'mL'),TK.o('×'),TK.q('df',df,'drops/mL',{uopt:'warn'})],[TK.q('h',hr,'hr'),TK.o('×'),TK.x('60')]),TK.o('→'),TK.f([TK.q('top',top,'drops',{uopt:'warn'})],[TK.q('bot',bot,'mins')])]});
  lines.push({lab:whole?'answer':'round',toks:whole?[TK.o('='),TK.q('a',rate,'drops/min')]:[TK.o('='),TK.q('raw',exact,'drops/min',{approx:true}),TK.o('→'),TK.q('a',rate,'drops/min')]});

  const S=[], vTxt=qq(vol);
  S.push({k:'pick',r:'iv',ask:'What VOLUME of fluid is going in?',sub:'the mL (or L) to be infused',reveal:vol.u==='L'?['v0']:['v'],ok:`${vTxt} is the volume to run in. It goes on the top.`});
  if(vol.u==='L'){
    S.push({k:'choice',chk:'units',ask:`The formula needs mL. The order says ${vTxt}. Convert first?`,reveal:['conv'],opts:[
      {t:'Yes — L into mL first',ok:true,msg:'Volume must be in mL. L → mL is × 1000, on its own line.'},
      {t:'No — use it as it is',ok:false,msg:`The formula says Volume (mL). ${vTxt} has to become mL first.`}]});
    S.push({k:'num',ask:'Convert it.',pre:`${vTxt} × 1000 =`,unit:'mL',v:mL,reveal:['v'],traps:[[r6(vol.v/1000),'Going from L down to mL the number gets BIGGER — × 1000.']],ok:`${qs(mL,'mL')}.`});
  }
  S.push({k:'pick',r:'df',ask:'What’s the DROP FACTOR?',sub:'drops per mL — set by the giving set',reveal:['df'],ok:`${df} drops per mL — it goes on the top with the volume.`});
  S.push({k:'pick',r:'t',ask:'How LONG does it run?',sub:'the time in hours',reveal:['h'],ok:`${hr} hour${hr===1?'':'s'} — on the bottom, × 60 to make minutes.`});
  if(o.pct) S.push({k:'choice',ask:`The bag is ${o.fluid}. Does the ${o.pct} go in the formula?`,opts:shuffle([
    {t:'No — red herring',ok:true,msg:'Right. The % is what’s IN the bag — nothing to do with how fast it drips. Joan calls these red herrings.'},
    {t:'Yes',ok:false,msg:`The ${o.pct} describes what’s in the bag, not the rate. A drip rate only needs volume, drop factor and time.`}])});
  S.push({k:'num',chk:'formula',ask:'Multiply the TOP first.',sub:'volume × drop factor',pre:`${qs(mL,'mL')} × ${df} =`,unit:'drops',v:top,reveal:['top'],traps:[[mL,'You haven’t multiplied by the drop factor yet.']],ok:`${fmt(top)} drops on the top.`});
  S.push({k:'num',ask:'Now multiply the BOTTOM.',sub:'hours × 60 = minutes',pre:`${hr}hr × 60 =`,unit:'mins',v:bot,reveal:['bot'],traps:[[r6(hr/60),'Multiply by 60 — hours into minutes.'],[hr,'× 60 turns the hours into minutes.']],ok:`${bot} minutes on the bottom.`});
  S.push({k:'num',ask:'NOW divide: top ÷ bottom.',sub:'2 decimal places is plenty',pre:`${fmt(top)} ÷ ${bot} =`,unit:'drops/min',v:exact,tol:0.1,reveal:whole?['raw','a']:['raw'],
    traps:[[r6(bot/top),'Upside down — it’s top ÷ bottom.']],ok:whole?`${rate} drops/min — already a whole number, no rounding needed.`:`${tr2(exact)} drops/min. Now round it.`});
  const lo=Math.floor(exact), hi=lo+1, up=rate===hi, d1=(tr2(exact).split('.')[1]||'0')[0];
  if(!whole){
    S.push({k:'choice',chk:'answer',ask:`Round ${tr2(exact)} to a whole drop.`,sub:'Joan: .4 or lower → round DOWN · .5 or higher → round UP (drip rates only)',reveal:['a'],opts:[
      {t:`${lo} drops/min`,ok:!up,msg:up?`.${d1} is .5 or higher — round UP to ${hi}.`:`.${d1} is .4 or lower — round DOWN to ${lo}.`},
      {t:`${hi} drops/min`,ok:up,msg:up?`.${d1} is .5 or higher — round UP to ${hi}.`:`.${d1} is .4 or lower — round DOWN to ${lo}.`}]});
  }
  const other=df===20?60:20;
  const traps=[
    {v:Math.round(mL/hr),slip:'factor',msg:'That’s mL per hour (volume ÷ hours). Drip rate = volume × drop factor ÷ (hours × 60).'},
    {v:roundHalfUp(mL*other,bot),slip:'factor',msg:`Wrong drop factor — this set is ${df} drops/mL, not ${other}.`},
  ];
  if(!whole) traps.push({v:up?lo:hi,slip:'rounding',msg:'Joan’s rule: .4 or lower round DOWN, .5 or higher round UP.'});
  traps.push({v:Math.round(mL*df/hr),slip:'time',msg:'You didn’t × 60 on the bottom — the hours have to become minutes.'});
  traps.push({v:roundHalfUp(mL,bot),slip:'factor',msg:'You left out the drop factor — the top is volume × drop factor.'});
  traps.push({v:Math.round(mL*df/hr*60),slip:'order',msg:'Calculator order — you typed it straight through. Multiply the top, multiply the bottom, THEN divide.'});
  return finish({cat:o.cat||'drip',prompt:o.prompt||'',chips:o.chips||[],lines,steps:S,answer:rate,exact,unit:'drops/min',aU:'drops/min',traps,
    sense:`${rate} drops/min — a rate you could actually count at the drip chamber.`});
}

/* ---- syringe dilution: add the volumes first, then formula 1 ---- */
function buildDil(o){
  const w=o.want, amp=o.amp, av=o.av, dv=o.dv, tot=r6(av+dv), ans=r6(w.v/amp.v*tot);
  const lines=[
    {lab:'add volumes',toks:[TK.q('av',av,'mL'),TK.o('+'),TK.q('dv',dv,'mL'),TK.o('='),TK.q('tot',tot,'mL')]},
    {lab:'formula',toks:[TK.f([TK.q('w',w.v,w.u)],[TK.q('g',amp.v,amp.u)]),TK.o('×'),TK.q('tot',tot,'mL'),TK.o('='),TK.q('a',ans,'mL')]},
  ];
  const S=[
    {k:'pick',r:'w',chk:'formula',ask:'What do you WANT?',sub:'what’s charted / prescribed',reveal:['w'],ok:`${qq(w)} is charted — your WANT, on top.`},
    {k:'pick',r:'g',ask:'How much DRUG is in the ampoule?',sub:'the mg (or mcg) in the whole ampoule',reveal:['g'],ok:`${qq(amp)} — the whole ampoule goes into the syringe, so that’s your GOT.`},
    {k:'pick',r:'av',ask:'What VOLUME is the ampoule?',sub:'its mL',reveal:['av'],ok:`${qs(av,'mL')} from the ampoule.`},
    {k:'pick',r:'dv',ask:'How much WATER do you add?',sub:'the diluent',reveal:['dv'],ok:`${qs(dv,'mL')} of water on top of it.`},
    {k:'num',chk:'units',ask:'ADD the volumes first.',sub:'ampoule + water = what’s in the syringe',pre:`${qs(av,'mL')} + ${qs(dv,'mL')} =`,unit:'mL',v:tot,reveal:['tot'],
      traps:[[dv,'Add the ampoule’s volume too.'],[av,'Add the water too.']],ok:`${qs(tot,'mL')} in the syringe.`},
    {k:'choice',ask:'So the syringe now holds…',opts:shuffle([
      {t:`${qq(amp)} in ${qs(tot,'mL')}`,ok:true,msg:`The drug doesn’t change — the whole ampoule is still in there, now spread through ${qs(tot,'mL')}. So GOT = ${qq(amp)}, VOLUME = ${qs(tot,'mL')}.`},
      {t:`${qq(amp)} in ${qs(av,'mL')}`,ok:false,msg:`That was BEFORE the water went in. Now it’s in ${qs(tot,'mL')}.`},
      {t:`${qq(w)} in ${qs(tot,'mL')}`,ok:false,msg:`${qq(w)} is what you WANT. The syringe holds the whole ampoule: ${qq(amp)}.`}])},
    {k:'num',chk:'formula',ask:'Now the calculator.',sub:'top ÷ bottom × total volume',pre:`${fmt(w.v)} ÷ ${fmt(amp.v)} × ${fmt(tot)} =`,unit:'mL',v:ans,reveal:['a'],
      traps:[[r6(w.v/amp.v*av),`You used the ampoule’s ${qs(av,'mL')} — after the water it’s ${qs(tot,'mL')}.`],[r6(w.v/amp.v*dv),'You used only the water — the total includes the ampoule.'],
        [r6(w.v/amp.v*dv+av),'Calculator order! You did ÷ × water + ampoule. Add the volumes FIRST.'],[r6(amp.v/w.v*tot),'Upside down — WANT goes on top.']],ok:`= ${qs(ans,'mL')}.`},
  ];
  const traps=[
    {v:r6(w.v/amp.v*av),slip:'dilution',msg:`You used the ampoule’s ${qs(av,'mL')} — after adding ${qs(dv,'mL')} of water the whole ${qq(amp)} is in ${qs(tot,'mL')}. Add the volumes first.`},
    {v:r6(w.v/amp.v*dv+av),slip:'order',msg:'Calculator order: ÷ × water + ampoule adds the ampoule LAST. Add the volumes first (her 3.7mL overdose example).'},
    {v:r6(w.v/amp.v*dv),slip:'dilution',msg:'You used only the water — the syringe holds ampoule + water.'},
    {v:r6(amp.v/w.v*tot),slip:'inverted',msg:'Formula upside down — WANT goes on top.'},
  ];
  return finish({cat:o.cat||'dil',prompt:o.prompt||'',chips:o.chips||[],lines,steps:S,answer:ans,exact:ans,unit:'mL',aU:'mL',traps,
    sense:`${qs(ans,'mL')} — less than the ${qs(tot,'mL')} in the syringe, as it must be.`});
}

/* ---- a bare unit conversion ---- */
function buildConv(o){
  const from=o.from, to=o.to, down=RANK[from.u]>RANK[to];
  const ans=down?r6(from.v*1000):r6(from.v/1000);
  const lines=[{lab:'convert',toks:[TK.q('c0',from.v,from.u),TK.o(down?'×':'÷'),TK.x('1000'),TK.o('='),TK.q('a',ans,to)]}];
  const S=[
    {k:'choice',chk:'units',ask:`${from.u} → ${to}: × 1000 or ÷ 1000?`,sub:'ladder: g → mg → mcg and L → mL — going DOWN is × 1000',reveal:['c0'],opts:[
      {t:'× 1000',ok:down,msg:down?`${from.u} is the bigger unit, so going down to ${to} the number gets BIGGER: × 1000.`:`${to} is the bigger unit — going UP the ladder the number gets SMALLER: ÷ 1000.`},
      {t:'÷ 1000',ok:!down,msg:!down?`${to} is the bigger unit — going UP the ladder the number gets SMALLER: ÷ 1000.`:`${from.u} is bigger than ${to}, so going down the number gets BIGGER: × 1000.`}]},
    {k:'num',ask:'Convert it.',pre:`${qq(from)} ${down?'×':'÷'} 1000 =`,unit:to,v:ans,reveal:['a'],
      traps:[[down?r6(from.v/1000):r6(from.v*1000),'Wrong way — check which unit is bigger.'],[down?r6(from.v*100):r6(from.v/100),'That’s 100 — each step is 1000 (three places).']],ok:`${qs(ans,to)}.`},
  ];
  const traps=[
    {v:down?r6(from.v/1000):r6(from.v*1000),slip:'units',msg:`Wrong way — going from ${from.u} to ${to} the number should get ${down?'BIGGER (× 1000)':'SMALLER (÷ 1000)'}.`},
    {v:down?r6(from.v*100):r6(from.v/100),slip:'units',msg:'You moved 2 places instead of 3 — every step on the ladder is × 1000.'},
  ];
  return finish({cat:'conv',prompt:o.prompt||'',chips:o.chips||[],lines,steps:S,answer:ans,exact:ans,unit:to,aU:to,traps,
    sense:`${qs(ans,to)} — going ${down?'down':'up'} the ladder the number got ${down?'bigger':'smaller'}, as it should.`});
}

const TABS=[ // [drug, strength, unit, form, sensible tablet counts]

  ['metformin',500,'mg','tablet',[2]],['paracetamol',500,'mg','tablet',[2]],['penicillin',250,'mg','tablet',[2]],
  ['amoxicillin',250,'mg','capsule',[2]],['amoxicillin',500,'mg','capsule',[2]],['cefalexin',250,'mg','capsule',[2]],

function genTab(opt){
  opt=opt||{};
  for(let i=0;i<300;i++){
    const [drug,S0,unit,form,counts]=rnd(TABS), n=rnd(counts), dose=r6(S0*n);
    const canConv=(unit==='mg'&&dose>=1000)||(unit==='mcg'&&dose>=50);
    const conv=opt.conv===true?true:opt.conv===false?false:(canConv&&chance(.5));
    if(conv&&!canConv) continue;
    const want=conv?{v:r6(dose/1000),u:unit==='mg'?'g':'mg'}:{v:dose,u:unit};
    if(!fmtOK(want.v)) continue;
    const {chips,sp}=PB(), who=rnd(ADULTS);

      ()=>`${who} is charted ${drug} ${W} orally. You have ${form}s of ${G}. How many ${form}s should you give?`,

  }
  return buildWG({cat:'tab',prompt:'Mr P. is prescribed <span class="qx" data-r="w">160mg</span> of gliclazide. You have tablets of <span class="qx" data-r="g">80mg</span>. How many tablets should you give?',
    chips:[{r:'w',t:'160mg'},{r:'g',t:'80mg'}],want:{v:160,u:'mg'},got:{v:80,u:'mg'},vol:{v:1,u:'tablet'}});
}

const CLEX=[[40,0.4,[20,40]],[60,0.6,[40,60]],[80,0.8,[40,60,80]],[100,1,[60,70,80,90,100]]];
function genInj(opt){
  opt=opt||{};
  for(let i=0;i<400;i++){

      const [sv,ml,doses]=rnd(CLEX), dose=rnd(doses), a=r6(dose/sv*ml);

    }
    const [drug,sv,su,ml,route,du,doses]=rnd(INJS), dose=rnd(doses), cross=su!==du;

  }
  return genTab(opt);
}

      else { got={v:D.liq[0],u:'mg'}; vol={v:D.liq[1],u:'mL'}; const a=r6(single/got.v*vol.v); if(!clean(a,2)||a>20||a<1) continue; }

const DRIP_FL=[['Sodium Chloride 0.9%','0.9%'],['Dextrose 5%','5%'],['Dextrose 4% with Sodium Chloride 0.18%','4% and 0.18%'],['Compound Sodium Lactate (Hartmann’s)',null]];
function genDrip(opt){
  opt=opt||{};
  for(let i=0;i<500;i++){
    const {chips,sp}=PB(), who=rnd(ADULTS);
    let fl,pct,mL,hr,df,blood=false;
    if(!opt.L&&opt.df!==60&&chance(.18)){ blood=true; fl='Red Blood Cells (RBC)'; pct=null; mL=rnd([250,300,400]); hr=rnd([2,3,4]); df=20; }
    else { [fl,pct]=rnd(DRIP_FL); mL=rnd([250,500,600,750,1000,1000,1500]); hr=rnd([1,2,3,4,5,6,8,10,12]); df=opt.df||rnd([20,60]); }
    const canL=[500,600,1000,1500].includes(mL);
    if(opt.L&&!canL) continue;
    const asL=opt.L?true:(!blood&&canL&&chance(.25));
    const top=mL*df, bot=hr*60, rate=roundHalfUp(top,bot);
    if(rate<8||rate>250) continue;
    const vol=asL?{v:r6(mL/1000),u:'L'}:{v:mL,u:'mL'};
    const FL=pct?sp('fluid',fl):fl, VOL=sp('iv',qq(vol)), T=sp('t',`${hr} hour${hr===1?'':'s'}`);
    let prompt;
    if(blood) prompt=`${who} is charted ${FL} ${VOL} IV over ${T}. The blood-giving set has a drip factor of ${sp('df',String(df))}. What drip rate do you set?`;
    else prompt=rnd([
      ()=>`${who} is charted an intravenous infusion of ${FL} ${VOL} to be infused over ${T}. The giving set has a drop factor of ${sp('df',String(df))}. What drip rate will be set?`,
      ()=>`An intravenous infusion of ${FL} is to be infused; ${VOL} over ${T}. The infusion set has a drop factor of ${sp('df',df+'drops/mL')}. What drip rate will be set?`,
      ()=>`${who} has been prescribed an IV infusion of ${FL} ${VOL} over ${T}. The IV giving set delivers ${sp('df',df+' drops per mL')}. What rate (drops per minute) should the nurse set?`,
    ])();
    return buildDrip({cat:'drip',prompt,chips,vol,df,hr,fluid:fl,pct});
  }
  return buildDrip({cat:'drip',prompt:'Tania has been prescribed an IV infusion of <span class="qx" data-r="fluid">Sodium Chloride 0.9%</span> <span class="qx" data-r="iv">1000mL</span> over <span class="qx" data-r="t">12 hours</span>. The IV giving set delivers <span class="qx" data-r="df">60 drops per mL</span>. What rate (drops per minute) should the nurse set?',

}

/* multiple-choice options for Joan's test: the answer + 3 classic slips (each option knows its slip) */
function mcqOpts(q){
  const isInt=q.aU==='drops/min', seen=new Set([fmt(q.answer)]), opts=[{v:q.answer,ok:true}];
  const add=(v,slip,msg)=>{ if(opts.length>=4) return; if(isInt) v=Math.round(v); v=r6(v);
    if(!(v>0)||!fmtOK(v)) return; const k=fmt(v); if(seen.has(k)) return; seen.add(k); opts.push({v,slip,msg}); };
  (q.traps||[]).forEach(t=>add(t.v,t.slip,t.msg));
  [[10,'units','Out by a factor of 10 — a decimal-place slip.'],[0.1,'units','Out by a factor of 10 — a decimal-place slip.'],[2,null,null],[0.5,null,null],[100,'units','Out by a factor of 100.'],[0.01,'units','Out by a factor of 100.'],[4,null,null],[0.25,null,null]]
    .forEach(([f,s,m])=>add(q.answer*f,s,m));
  if(isInt) [5,-5,10,-10,1,-1].forEach(d=>add(q.answer+d,null,null));
  return shuffle(opts);
}

const FLUIDS=['0.9% sodium chloride',"compound sodium lactate (Hartmann's)",'5% glucose','0.45% sodium chloride with 5% glucose'];
const MINIBAG=[ // [additive, minimum sensible infusion minutes — keeps drug/duration pairings clinically plausible]
  ['cefazolin 1 g',15],['vancomycin 500 mg',60],['potassium chloride 10 mmol',60],['metronidazole 500 mg',20]];
const RATE_H=[[1000,8],[1000,10],[1000,4],[1000,12],[1000,6],[1000,24],[500,4],[500,2],[500,6],[500,8],[250,2],[250,4]];
const RATE_M=[[100,30],[100,20],[100,15],[50,30],[50,15],[250,30],[200,60],[150,30],[100,60]];
function gRate(){
  if(chance(.55)){
    const [v,h]=rnd(RATE_H), exact=v/h, ans=Math.round(exact);
    const needRound=Math.abs(exact-ans)>0.001;
    const traps=[{v:exact/60, slip:'time', msg:`that's mL per <b>minute</b> — the pump wants mL per <b>hour</b>.`}];
    return {cat:'rate',
      prompt:`<b>${fmt(v)} mL</b> of ${rnd(FLUIDS)} is charted to run over <b>${fmt(h)} hours</b> via infusion pump. What rate will you set?${needRound?'<span class="roundnote">Round to the nearest whole number.</span>':''}`,
      unit:'mL/hr', answer:ans, exact, tol:0, steps:[
        `Rate (mL/hr) = volume ÷ time in hours`,
        `= ${fmt(v)} ÷ ${fmt(h)} = <em>${fmt(exact)} mL/hr</em>${needRound?` → round to <em>${fmt(ans)} mL/hr</em>`:''}`,
      ], traps};
  } else {
    const [v,m]=rnd(RATE_M), exact=v/m*60, ans=Math.round(exact);
    const bag=rnd(MINIBAG.filter(b=>m>=b[1]))[0];
    const traps=[{v:v/m, slip:'time', msg:`that's mL per <b>minute</b>. Multiply by 60 to get mL per <b>hour</b> — pumps are set in mL/hr.`}];
    return {cat:'rate',
      prompt:`${rnd(NAMES)} has <b>${bag}</b> in <b>${fmt(v)} mL</b> to run over <b>${fmt(m)} minutes</b> via pump. What rate in mL/hr will you set?`,
      unit:'mL/hr', answer:ans, exact, tol:0, steps:[
        `Rate (mL/hr) = (volume ÷ minutes) × 60`,
        `= (${fmt(v)} ÷ ${fmt(m)}) × 60 = <em>${fmt(exact)} mL/hr</em>`,
      ], traps};
  }
}
const TIMES=[ // [mL, mL/hr, answer, unit]
  [1000,125,8,'hours'],[1000,100,10,'hours'],[500,125,4,'hours'],[500,100,5,'hours'],
  [250,125,2,'hours'],[1000,250,4,'hours'],[500,250,2,'hours'],[250,50,5,'hours'],
  [100,200,30,'minutes'],[250,100,150,'minutes'],[50,100,30,'minutes'],[100,300,20,'minutes'],[150,200,45,'minutes'],
];
function gTime(){
  const [v,r,ans,unit]=rnd(TIMES);
  const hrs=v/r;
  const traps=[];
  if(unit==='hours'){ traps.push({v:ans*60, slip:'time', msg:`that's the answer in <b>minutes</b> — the question asks for hours.`}); }
  else { traps.push({v:hrs, slip:'time', msg:`that's the answer in <b>hours</b> — the question asks for minutes (× 60).`}); }
  if(Math.abs(r/v-ans)>0.01) traps.push({v:r/v, slip:'inverted', msg:`upside-down: it's <b>volume ÷ rate</b>, not rate ÷ volume.`});
  return {cat:'time',
    prompt:`An infusion of <b>${fmt(v)} mL</b> is running at <b>${fmt(r)} mL/hr</b>. How long will it take to finish, in <b>${unit}</b>?`,
    unit, answer:ans, exact:ans, tol:0, steps:[
      `Time (hours) = volume ÷ rate = ${fmt(v)} ÷ ${fmt(r)} = <em>${fmt(hrs)} hours</em>`,
      unit==='minutes'?`Convert: ${fmt(hrs)} h × 60 = <em>${fmt(ans)} minutes</em>`:`Answer: <em>${fmt(ans)} hours</em>`,
    ], traps};
}

/* ============================== grading ============================== */
function grade(q,u){
  const eps=1e-6;
  if(Math.abs(u-q.answer)<=(q.tol||0)+eps) return {ok:true};
  // right maths, wrong rounding
  if(q.exact!=null && Math.abs(q.exact-q.answer)>eps && Math.abs(u-q.exact)<=0.06)
    return {ok:false, slip:'rounding', msg:`your maths is right (${fmt(q.exact)}) but the answer must be <b>rounded to ${fmt(q.answer)}</b> — Joan: .4 or lower down, .5 or higher up.`, near:true};
  for(const t of q.traps){ if(near(u,t.v)) return {ok:false, slip:t.slip, msg:t.msg}; }
  // generic decimal-place slip
  if(u>0){ for(const p of [10,100,1000]){
    if(near(u/q.answer,p,p*0.004)||near(u/q.answer,1/p,0.004/p))
      return {ok:false, slip:'units', msg:`you're out by a factor of <b>${p}</b> — a decimal-place slip. In real life this is the dangerous one: always ask “does the answer look correct?”`};
  }}
  return {ok:false};
}
/* one box of "fill the working", marked the way her markers mark */
function gradeSlot(s,raw){
  const p=parseQty(raw);
  if(p.empty) return {st:'bad',msg:'Blank — every box needs a number and its unit.'};
  if(p.bad) return {st:'bad',msg:`Couldn’t read “${raw}” — write a number then its unit, like ${qs(s.v,s.u)}.`};
  const numOk=s.approx?Math.abs(p.v-s.v)<=0.1:same(p.v,s.v);
  if(numOk&&p.u===s.u) return p.leadDot?{st:'warn',msg:'Write a 0 before the decimal point — 0.5, never .5 (Joan’s rule).'}:{st:'ok'};
  if(numOk&&s.ualt&&s.ualt.includes(p.u)) return {st:'warn',msg:`Accepted — but ${uName(s.u,s.v)} makes it clear this is the whole day’s total.`};
  if(numOk&&!p.u){
    if(s.uopt==='ok') return {st:'ok'};
    if(s.uopt==='warn') return {st:'warn',msg:`Accepted (her own answer sheet does this) — but safest to write the unit: ${qs(s.v,s.u)}.`};
    return {st:'bad',msg:`No unit. Her markers fail working without units — write ${qs(s.v,s.u)}.`};
  }
  if(numOk) return {st:'bad',msg:`Right number, wrong unit — it should be ${uName(s.u,s.v)}${p.u&&p.u!=='?'?`, not ${uName(p.u,p.v)}`:''}.`};
  return {st:'bad',msg:`Not this number. ${BOXHINT[s.k]||''}`};
}
function recordDrill(cat,ok,slip){
  const st=S.stats[cat]; if(!st) return; st.a++; if(ok)st.c++;
  st.last.push(ok?1:0); if(st.last.length>20)st.last.shift();
  if(slip) S.slips[slip]=(S.slips[slip]||0)+1;
  S.streak = ok ? S.streak+1 : 0;
  if(S.streak>S.best) S.best=S.streak;
  save();
}
function mastery(cat){
  const st=S.stats[cat];
  if(!st||st.a<8) return {lv:0,txt:'untrained',pct:st&&st.a?Math.round(st.c/st.a*100):0};
  const p=Math.round(st.last.reduce((a,b)=>a+b,0)/st.last.length*100);
  return {lv: p>=90?3 : p>=70?2 : 1, txt: p>=90?'mastered':p>=70?'solid':'shaky', pct:p};
}

function newGuided(q){ return {q,si:0,rev:new Set(),hl:new Set(),fresh:new Set(),fb:null,bad:new Set(),done:false,chk:new Set(),tries:0,last:''}; }

function pickMsg(c,st){ return `${c.t} is ${ROLE[c.r]||'not the one'}. You’re looking for ${st.sub||ROLE[st.r]}.`; }
function wireGuided(g,rerender){
  $$('#view .q .qx').forEach(s=>s.classList.toggle('hl',g.hl.has(s.dataset.r)));
  if(g.done) return;
  const st=g.q.steps[g.si];
  const advance=(msg,cls,reveal)=>{
    g.fresh=new Set(reveal||[]); (reveal||[]).forEach(k=>g.rev.add(k));
    if(st.chk) g.chk.add(st.chk);
    g.fb={c:cls||'ok',h:(cls==='alt'?'↪ ':'✓ ')+esc(msg)}; g.bad=new Set(); g.si++; g.tries=0; g.last='';
    if(g.si>=g.q.steps.length){ g.done=true; CHK.forEach(([k])=>g.chk.add(k)); }
    rerender();
  };
  if(st.k==='pick') $$('#view [data-c]').forEach(b=>b.onclick=()=>{
    const c=g.q.chips[+b.dataset.c];
    if(c.r===st.r){ g.hl.add(c.r); advance(st.ok,'ok',st.reveal); }
    else { g.bad.add('c'+b.dataset.c); g.fb={c:'no',h:'✗ '+esc(pickMsg(c,st))}; rerender(); }
  });
  else if(st.k==='choice') $$('#view [data-o]').forEach(b=>b.onclick=()=>{

    else if(o.ok==='alt') advance(o.msg,'alt',(st.opts.find(x=>x.ok===true)||{}).reveal||st.reveal);  // accepted, but steered onto her preferred path
    else { g.bad.add('o'+b.dataset.o); g.fb={c:'no',h:'✗ '+esc(o.msg)}; rerender(); }
  });
  else {
    const inp=$('#gin'); inp.focus(); inp.setSelectionRange(inp.value.length,inp.value.length);
    const go=()=>{
      g.last=inp.value;

      if(!isFinite(u)){ inp.focus(); return; }
      if(st.tol?Math.abs(u-st.v)<=st.tol:same(u,st.v)){ advance(st.ok||`${fmt(st.v)} ${st.unit}`,'ok',st.reveal); return; }
      const t=(st.traps||[]).find(t=>same(u,t[0]));

      if(!t&&u>0){ for(const p of [10,100,1000]){ if(same(u/st.v,p)||same(u/st.v,1/p)){ msg=`Out by a factor of ${p} — check the decimal point.`; break; } } }

    $('#gok').onclick=go; inp.onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); e.stopPropagation(); go(); } };
    const sh=$('#gshow'); if(sh) sh.onclick=()=>advance(`It’s ${fmt(st.v)} ${st.unit}. ${st.ok||''}`,'alt',st.reveal);

}

function checkDrill(){

  if(S.est && estPick!==null && Q.est){
    const picked=Q.est.opts[estPick], trueTier=tierIndex(Q.answer), typedTier=tierIndex(u);
    if(g.ok){
      estNote = picked.gi===trueTier
        ? `🎯 <b>Estimate on point.</b> You sized it up before calculating — that's the instinct that catches decimal-place slips at the bedside.`
        : `Right answer — but your size estimate (<b>${MAGTIERS[picked.gi][2]}</b>) was off; it lands in <b>${MAGTIERS[trueTier][2]}</b>. Worth clocking that gap.`;
    } else if(typedTier!==picked.gi){
      estNote = `🎯 <b>Your own estimate flagged this.</b> You guessed <b>${picked.name}</b> (${picked.range}) but entered ${fmt(u)} — that clash between gut and answer is exactly when to stop and re-check.`;
    } else if(picked.gi===trueTier){
      estNote = `Your ballpark (<b>${picked.name}</b>) was right — the slip was in the arithmetic, not the size. Fix the step and trust the estimate.`;
    } else {
      estNote = `Both your estimate and your answer landed in <b>${picked.name}</b>, but the real size is <b>${MAGTIERS[trueTier][2]}</b> — recalibrate your feel for this one.`;
    }

  renderDrill(false);
}

  res.forEach(r=>{ if(!r.blank) recordDrill(r.q.cat,r.ok,r.ok?null:r.o.slip); });
  const nOk=res.filter(r=>r.ok).length, blank=res.filter(r=>r.blank).length, mins=Math.round(M.spent.reduce((a,b)=>a+b,0)/60000);
  const now=new Date(), d=`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;   // local date — NZ is a day ahead of UTC each morning
  S.tests.unshift({d,score:Math.round(nOk/res.length*100),n:res.length,ok:nOk,blank,pass:false,kind:'joan',mins,work:null});
  S.tests=S.tests.slice(0,20); save();
  M.res=res;
  if(show){ renderMockResults(); window.scrollTo({top:0}); }
}

function histRow(t){

  {id:'L9',n:9,title:'Test day',sub:'her checklist, the 2-minute rule, the rules',min:3,kind:'final',read:()=>`
    <h3>Test day</h3>
    <ul>
      <li><b>The format:</b> 15 multiple-choice questions on Canvas, 30 minutes including reading. Working on paper with your name on every sheet, photographed and uploaded to “Calculations Test Upload”, sheets handed in. The answer AND the working must both be right.</li>
      <li><b>Her checklist, every question:</b> No distractions · Units the same? · Formula · Answer looks correct? · Double check.</li>
      <li><b>The 2-minute rule:</b> that’s your time per question. Stuck? Skip it, come back at the end. A blank is a guaranteed fail.</li>
      <li><b>Calculator:</b> bring a simple one. Not your phone, not the laptop’s.</li>
      <li><b>On your paper:</b> the question number by each working · a 0 before every decimal (0.5) · a unit on every number · don’t round volumes · do round drip rates.</li>
      <li><b>Red herrings:</b> how often (tds, qid, every 6 hours), the % on a bag, the bottle’s total volume, the patient’s name.</li>
    </ul>
    <div class="callout warn"><b>A clash in the course material, flagged rather than hidden:</b> her Practice Test 4 (Q15) says “simple calculator only”, but her 25 Aug test post also allows scientific (not graphics). A simple calculator satisfies both.</div>
    <div class="callout">Each resit is “similar but not the same”, so <b>Joan’s test</b> here gives you fresh numbers every sitting — sit it until 15/15 is boring.</div>`},
];

/* ---------- modals ---------- */
function openModal(html){ $('#sheet').innerHTML=`<button class="close" id="mclose">✕</button>${html}`; $('#modal').classList.remove('hidden'); $('#mclose').onclick=closeModal; }
function closeModal(){ $('#modal').classList.add('hidden'); }
$('#modal').onclick=e=>{ if(e.target.id==='modal') closeModal(); };
$('#btnFormulas').onclick=()=>openModal(`
  <h3>∑ Joan’s formula sheet</h3>
  <div class="fcard"><div class="fn">1 · Tablets, liquids, injections</div>${FORMULA1()}<div class="fx"><small>WANT = prescribed / charted / ordered · GOT = in stock / on hand / you have · VOLUME = what the GOT comes in (1 tablet, 5mL, 2mL).</small></div></div>
  <div class="fcard"><div class="fn">2 · Body weight</div>${FORMULA2()}<div class="fx"><small>A single dose ignores how often (tds, qid, every 6 hours). For mL, the mg you made is the WANT in formula 1. mg/kg/day: day total → ÷ doses → formula 1.</small></div></div>
  <div class="fcard"><div class="fn">3 · Drip rate (drops/min)</div>${FORMULA3()}<div class="fx"><small>Drop factor 20 or 60 drops/mL. Multiply the top, multiply the bottom, THEN divide. Round .4 down, .5 up — drip rates only.</small></div></div>
  <div class="fcard"><div class="fn">Units ladder</div><div class="fx"><code>g → mg → mcg</code> each step × 1000 · <code>L → mL</code> × 1000<small>Units must match top and bottom. Multiply the bigger unit down (× 1000) on its own line first. A 0 before every decimal: 0.5, never .5.</small></div></div>
  <div class="fcard"><div class="fn">Special cases</div><div class="fx"><small>1:1000 = 1g in 1000mL = 1mg/1mL · Powder: use the strength AFTER mixing · Syringe dilution: add the volumes first (1mL + 9mL = 10mL); GOT = the whole ampoule’s mg.</small></div></div>
  <div class="fcard"><div class="fn">Her checklist</div><div class="fx">No distractions · Units the same? · Formula · Answer looks correct? · Double check</div></div>
  <div class="fcard"><div class="fn">Extra — not in her 2026 slides</div><div class="fx"><code>mL/hr = volume ÷ hours</code> · <code>time = volume ÷ rate</code><small>The Student Guide lists these, but no 2026 practice test asks them. They live in Drill under “Extra”.</small></div></div>
  <div class="fcard"><div class="fn">Why “mcg” here</div><div class="fx"><small>On real NZ charts, write microgram in full — “mcg” is an error-prone abbreviation. Joan’s test papers print “mcg”, so this trainer matches the test.</small></div></div>`);
$('#btnHelp').onclick=()=>openModal(`
  <h3>? How this works</h3>
  <div class="fcard"><div class="fn">What it is</div><div class="fx">A trainer for the 722.544 medication calculations test that teaches <b>Joan’s</b> method — her three formulas, her layout, her checklist. Built from her 2026 slides (Medication Calculations Parts One &amp; Two), her Canvas answer sheets, Practice Tests 3–5 and her results post (27 Aug).</div></div>
  <div class="fcard"><div class="fn">📘 Learn</div><div class="fx">10 short lessons in her order. Each one: read her example → two <b>with me</b> (one small question at a time; the working writes itself as you answer) → two <b>your turn</b> (you fill every box of the working yourself, and each box is marked).</div></div>
  <div class="fcard"><div class="fn">Drill</div><div class="fx">Endless fresh questions. Type the answer, or switch on <b>✍️ Fill the working</b> to write every line. A wrong answer gets its slip named (upside down, forgot the volume, didn’t convert…).</div></div>
  <div class="fcard"><div class="fn">Joan’s test</div><div class="fx">Her format: 15 multiple-choice, 30 minutes, 15/15 to pass. Write your working on paper; at the end you mark it against her layout. Each wrong option is a real slip, so a wrong pick tells you which one you made.</div></div>
  <div class="fcard"><div class="fn">How a box is marked</div><div class="fx">Right number AND right unit = ✓. Missing unit = ✗ (her markers’ #2 reason). The right number in the wrong box = ✗. Two soft spots copy her own answer sheets: a bare “20” drop factor and a bare “× 1” for one tablet are accepted with a nudge to write the unit.</div></div>
  <div class="fcard"><div class="fn">Course-material flags</div><div class="fx"><small>1 · Calculator: Practice Test 4 Q15 says simple only; her 25 Aug post also allows scientific (not graphics) — bring a simple one.<br>2 · Her daily-dosing slide writes the day total as “40mg/kg/day”; it’s 40mg/day.<br>3 · The Student Guide lists mL/hr and completion times; the 2026 slides teach drops/min only — those two live under Drill → Extra.</small></div></div>
  <div class="fcard"><div class="fn">For admin</div><div class="fx"><small>Progress lives in this browser’s localStorage under <code>medcalcdrill.v1</code> (synced through the hub when signed in). Every question comes from the “Joan engine” in index.html — no question bank, no AI. After editing it, run <code>node audit.js</code>: it re-solves every question from its displayed numbers and re-checks every line of working. It must report zero failures before pushing.</small></div></div>`);

/* ---------- theme ----------
   Shares localStorage['hub.theme'] with the BN Hub so one toggle carries across the estate.
   The hub's value wins on load; toggling here writes back to both. */
const HTK='hub.theme';
function applyTheme(){ document.documentElement.setAttribute('data-theme',S.theme); }
$('#btnTheme').onclick=()=>{ S.theme=S.theme==='dark'?'light':'dark'; save(); try{localStorage.setItem(HTK,S.theme);}catch(e){} applyTheme(); };
try{ S.theme=localStorage.getItem(HTK)||S.theme; localStorage.setItem(HTK,S.theme); save(); }catch(e){}
applyTheme();

/* ---------- go: anyone who hasn't finished the path lands on it ---------- */
nav(nextLesson()?'learn':'drill');
</script>
<script>
/* ===== STUDY BUS v2 (hub ⚡ engine — see estate STUDY-ENGINE-SPEC.md) =====
   Copy-in block, app-tailored. MedCalc's questions are procedurally
   generated, so it can't hand cards to the hub's player — it stays a
   kind:'link' offer: the one OUTRO drill after the in-hub cards. Jobs:
   (1) bid the next lesson, then the shakiest topics, (2) honour ?cat= / ?v=
   deep links, (3) show the ?sb=out finish bar back to the hub. */
(function(){
'use strict';
const APP='medcalc', NAME='MedCalc Drill';
const here=location.origin+location.pathname;
const eq=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');

function offers(){
  // bid the shakiest categories — evPerMin is raw memory value only;
  // the hub multiplies in exam weight, urgency and the hurdle boost
  const out=Object.keys(CATS).filter(k=>!CATS[k].extra)
    .map(k=>({k,m:mastery(k)}))
    .filter(x=>x.m.lv<=1)
    .sort((a,b)=>a.m.lv-b.m.lv || a.m.pct-b.m.pct)
    .slice(0,3)
    .map(x=>({ label:CATS[x.k].icon+' '+CATS[x.k].name+' drill', topic:'pharm-calc',
      assess:['pharm-medcalc','pharm-final'],
      evPerMin:x.m.lv===0?0.5:0.38, kind:'link', minutes:6, deep:'?cat='+x.k }));
  const nx=nextLesson();
  if(nx) out.unshift({ label:'📘 Joan’s way · '+nx.n+'. '+nx.title, topic:'pharm-calc',
    assess:['pharm-medcalc'], evPerMin:0.6, kind:'link', minutes:nx.min, deep:'?v=learn' });
  out.push({ label:'✨ Mixed med-calc drill', topic:'pharm-calc',
    assess:['pharm-medcalc','pharm-final'], evPerMin:0.25, kind:'link', minutes:6, deep:'?cat=all' });
  return out;
}
function pulse(){ try{ localStorage.setItem('studybus.pulse.'+APP,
  JSON.stringify({v:2,app:APP,name:NAME,url:here,ts:Date.now(),offers:offers()})); }catch(e){} }
pulse();
addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') pulse(); });
addEventListener('pagehide',pulse);

/* deep links: land in the right place */
const q=new URLSearchParams(location.search), cat=q.get('cat'), v=q.get('v');
if(cat&&(cat==='all'||CATS[cat])){ S.cat=cat; save(); nav('drill'); }
else if(v&&['learn','drill','test','stats'].includes(v)) nav(v);

/* outro finish bar (?sb=out): drill for the planned minutes, then Finish
   returns to the hub's done screen for the full-session tally */
if(q.get('sb')!=='out') return;
let plan=null; try{ plan=JSON.parse(localStorage.getItem('studybus.plan')); }catch(e){}
const leg=plan&&plan.outro&&plan.outro[0];
if(!leg||!plan.hub) return;   // no plan on this device → app just works normally
const href=plan.hub+(plan.hub.includes('?')?'&':'?')+'sbdone=1';
const bar=document.createElement('div'); bar.id='sbbar';
bar.innerHTML='<span class="l">⚡ Final leg · '+eq(leg.label||'drill')+' · '+(leg.minutes||6)+'′</span>'+
  '<a class="n" href="'+eq(href)+'">Finish →</a>';
const st=document.createElement('style');
st.textContent='#sbbar{position:fixed;left:0;right:0;bottom:0;z-index:90;display:flex;align-items:center;gap:10px;min-height:52px;padding:8px 14px calc(8px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line2);color:var(--tx);font:600 13px/1.3 -apple-system,"Segoe UI",Roboto,sans-serif}#sbbar .l{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#sbbar .n{flex:0 0 auto;background:var(--acc);color:#fff;text-decoration:none;font-weight:800;padding:9px 14px;border-radius:10px;min-height:36px;display:inline-flex;align-items:center}#sbbar .n.due{animation:sbp 1.1s ease-in-out infinite}@keyframes sbp{50%{box-shadow:0 0 0 7px var(--acc-soft)}}body{padding-bottom:78px}';
document.head.appendChild(st); document.body.appendChild(bar);
setTimeout(function(){ var n=bar.querySelector('.n'); if(n) n.classList.add('due'); },(leg.minutes||6)*60e3);
})();
</script>
